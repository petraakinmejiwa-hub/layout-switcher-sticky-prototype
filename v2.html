<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Layout switcher – compact v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Roboto:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens taken from the Figma file (Fortuna Dark) */
  :root{
    --bg:#0e0e11;            /* frame background */
    --surface:#22222a;       /* table / rows */
    --surface-2:#18181e;     /* league header, +N pill */
    --brand:#ffdb01;         /* app bar, selected odd, chip stroke */
    --text:#ffffff; --text-2:#dfdfe6; --muted:#b0b0c0;
    --live:#17cf2f; --up:#0e7c1d; --down:#c42d16; --split-up:#2fbf45; --split-down:#e2412a;
    --pin-on:#d2252a; --pin-off:#58585f; --star:#d0d0d2;
    --line:rgba(255,255,255,.10); --chip:rgba(255,255,255,.10);
    --nav-h:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#050507;color:var(--text);font-family:Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  img{display:block}

  /* The design is 375 wide; .phone is zoomed (JS) to fill the device width.
     Phone: fills the real screen. Desktop: shown inside an iPhone 16 (393×852 pt). */
  :root{--safe-b:env(safe-area-inset-bottom,0px);--status-h:0px;--appbar-h:calc(var(--status-h) + 54px)}
  .phone{position:relative;width:375px;margin:0 auto;min-height:100vh;background:var(--bg)}
  .status16,.home-ind,.island{display:none}
  @media (min-width:600px){
    :root{--status-h:52px;--safe-b:32px;--appbar-h:calc(var(--status-h) + 54px)}  /* 54pt status bar / 34pt home area, in design px */
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
    .device{position:relative;flex:0 0 auto;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--bg);
      box-shadow:0 0 0 2px #3a3a40,0 0 0 11px #121214,0 0 0 12px #2c2c31,0 30px 80px rgba(0,0,0,.6)}
    .phone{min-height:0;height:calc(852px / var(--k));overflow:hidden}
    .scroller{height:100%;overflow-y:auto;overscroll-behavior:contain}
    .status16{display:flex;position:absolute;top:0;left:0;right:0;height:var(--status-h);align-items:center;justify-content:space-between;padding:0 30px 0 38px;font:600 15px/1 Inter,-apple-system,sans-serif;color:#000;z-index:2}
    .status16 .icons{display:flex;gap:6px;align-items:center}
    .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:19px;background:#000;z-index:60}
    .home-ind{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#fff;z-index:60}
  }
  /* Phone: stop pull-to-refresh / bounce from jumping the page */
  html{overscroll-behavior-y:none}
  .scroller{scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}

  /* PA Top_header 0.1 (exported from Figma) */
  /* the Figma header's old iPhone-8 status bar (top 20px) is cropped off; iPhone 16 status bar sits above */
  .appbar{position:sticky;top:0;z-index:30;height:var(--appbar-h);background:var(--brand)}
  .appbar .bar{position:absolute;left:0;right:0;top:var(--status-h);height:54px}
  .appbar img{width:375px;height:86px;max-width:none;position:absolute;top:-20px;left:0;clip-path:inset(20px 0 0 0);pointer-events:none}

  /* the list ends right above the bottom nav: no empty space, no scrolling past the games */
  main{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px)}
  .h-scroll{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .h-scroll::-webkit-scrollbar{display:none}
  .h-scroll img{flex:0 0 auto;scroll-snap-align:start}
  /* Herobanners Section: padding 4/8, gap 8, banners 180×100 */
  .heroes{padding:4px 8px;gap:8px}
  .heroes img{width:180px;height:100px}
  /* Pre-made_AKO: padding 12/12/0/12, gap 8 */
  .akos{padding:12px 12px 0;gap:8px;align-items:flex-start}
  .akos img.tall{width:320px;height:185px}
  .akos img.short{width:332px;height:180px}

  /* Section_header: 54 high, padding-top 14, sides 8 */
  .section-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:14px 8px 0}
  .section-head h2{margin:0 0 10px;font:600 16px/20px Roboto}
  .toggle{display:flex;align-items:center;font:500 12px Inter,sans-serif;color:var(--text-2);height:40px}
  .switch{width:64px;height:40px;display:grid;place-items:center}
  .switch i{position:relative;width:48px;height:24px;border-radius:12px;background:var(--brand);transition:background .2s}
  .switch i::after{content:"";position:absolute;top:3px;left:27px;width:18px;height:18px;border-radius:50%;background:#000;transition:left .2s}
  .switch[aria-checked="false"] i{background:var(--text-2);box-shadow:inset 0 0 0 1px #363644}
  .switch[aria-checked="false"] i::after{left:3px}

  /* CO Filter_chip 0.1 / Size S: 32 high, pill, padding 12, gap 8, 14px label */
  .chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .sport-chips{padding:12px 8px 8px}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:30px;background:var(--chip);color:var(--text-2);font:500 14px/16px Roboto;white-space:nowrap;box-shadow:inset 0 0 0 1px transparent}
  .chip svg{width:16px;height:16px;flex:0 0 16px}
  .sport-chips .chip[aria-pressed="true"]{color:#fff;box-shadow:inset 0 0 0 1px var(--brand)}
  .market .chip[aria-pressed="true"]{color:#fff;box-shadow:inset 0 0 0 1px var(--muted)}
  .chip.live{gap:8px}
  .chip.live[aria-pressed="true"]{color:#fff;box-shadow:inset 0 0 0 1px var(--live)}
  .chip.live svg{width:8px;height:8px;flex-basis:8px}

  /* Odds table */
  .table{margin:0 8px;border-radius:8px;background:var(--surface)}
  .market{display:flex;height:48px;align-items:center}
  .market .fixed{display:flex;align-items:center;gap:8px;padding:8px}
  .market .fixed .vline{width:1px;height:32px;background:rgba(255,255,255,.2)}
  .market .chips{padding:8px 8px 8px 0}

  .league{position:relative}
  /* Tournament_header: 32 high, padding 4/12, gap 8 */
  /* Only the first header row (.bar) is sticky and carries 1 X 2; its league name follows the scroll.
     The other competitions have a plain header (name + pin) that slides under it. */
  .lh.bar{position:sticky;top:var(--appbar-h);z-index:10}
  .lh{position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:4px 12px;background:var(--surface-2)}
  .lh .name{flex:1;min-width:0;font:600 14px/16px Roboto;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lh .labels{display:flex;width:var(--odds-w);flex:0 0 var(--odds-w);font:600 12px/15px Inter,sans-serif;color:var(--text-2)}
  .lh .labels span{flex:1;text-align:center}
  .lh .pin{width:36px;flex:0 0 36px;height:24px;display:grid;place-items:center}

  /* Table_row: content 70 + separator 1; padding 12, gap 8 */
  .row{position:relative}
  .row .content{display:flex;align-items:stretch;gap:8px;padding:0 12px;min-height:70px}
  .row .sep{height:1px;margin:0 12px;background:var(--line)}
  .ev{flex:1;min-width:0;display:flex;gap:8px}
  .tcol{width:36px;flex:0 0 36px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:17px}
  .tcol svg{width:14px;height:14px}
  .tcol .t{font:600 12px/22px Inter,sans-serif;width:36px;text-align:center}
  .tcol .t.live{color:var(--live)}
  .teams{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:16px 0}
  .team{display:flex;align-items:center;gap:8px;height:16px;font:600 14px/16px Roboto}
  .team .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .s{font-weight:700}
  .team .s.sets{font:700 12px/16px Inter;word-spacing:4px}
  .team .serve{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:0 0 6px}
  .vdiv{width:1px;flex:0 0 1px;height:50px;align-self:center;background:var(--line)}
  .odds{display:flex;width:var(--odds-w);flex:0 0 var(--odds-w)}
  .odd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 14px/16px Roboto;color:#fff;position:relative}
  .odd[aria-pressed="true"]{background:var(--brand);color:#000}
  .odd .arr{position:absolute;left:50%;transform:translateX(-50%);width:16px;height:12px}
  .odd .arr.top{top:6px} .odd .arr.bottom{bottom:6px}
  .odd .prev{font:500 11px/13px Inter;color:var(--muted);text-decoration:line-through}
  .odd.split-up .v{color:var(--split-up)} .odd.split-down .v{color:var(--split-down)}
  .odd[aria-pressed="true"] .v,.odd[aria-pressed="true"] .prev{color:#000}
  .odd.locked{cursor:default}
  /* Meta: 36 wide, padding 8/8, space-between */
  .meta{width:36px;flex:0 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0}
  .star{width:24px;height:24px}
  .pill{background:var(--surface-2);border-radius:4px;padding:4px;font:600 12px/15px Inter,sans-serif;color:var(--text-2)}
  /* Show_more: 40 high, gap 4 */
  .more{width:100%;height:40px;display:flex;align-items:center;justify-content:center;gap:4px;font:600 12px/15px Inter,sans-serif;color:var(--text-2)}
  .more svg{width:20px;height:20px;transition:transform .2s}
  .more[aria-expanded="true"] svg{transform:rotate(180deg)}
  .league:last-child .more{border-radius:0 0 8px 8px}

  .cards img{width:375px;height:auto;max-width:100%}
  .empty{padding:32px 16px;text-align:center;color:var(--text-2);font:500 13px Inter,sans-serif}

  /* PA Sport_bottom_nav_bar 0.1 (exported from Figma) */
  .nav{position:fixed;left:0;bottom:0;width:375px;height:calc(var(--nav-h) + var(--safe-b));z-index:40;background:var(--bg)}
  @media (min-width:600px){.nav{position:absolute}}
  .nav img{position:absolute;bottom:var(--safe-b);left:0;width:375px;height:56px;max-width:none;pointer-events:none}
  .nav .hits{position:absolute;left:0;right:0;top:0;height:var(--nav-h);display:flex}
  .nav .hits button{flex:1}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translate(-50%,20px);width:calc(100% - 32px);max-width:343px;background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;font:500 13px Roboto;box-shadow:0 4px 12px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
  @media (min-width:600px){.toast{position:absolute}}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast svg{flex:0 0 24px}
  .proto-note{max-width:375px;margin:14px auto 0;flex:0 0 auto;color:#6c6c78;font:500 11px Inter,sans-serif;text-align:center}
  @media (max-width:599px){.proto-note{display:none}}

  /* ===================== v2 — review notes =====================
     Same colour tokens. Restyled filters + table, inspired by Figma 1318-38055 (Midnite-style). */
  /* 1a/b. Sport filter: smaller pills, selected = solid light fill */
  .sport-chips{padding:8px 8px 4px;gap:6px}
  .sport-chips .chip{height:28px;padding:0 10px;gap:6px;font:500 13px/16px Roboto;box-shadow:none}
  .sport-chips .chip{padding:0 12px}
  .sport-chips .chip svg{display:none}
  .sport-chips .chip[aria-pressed="true"]{background:var(--text-2);color:var(--bg);box-shadow:none}
  /* Bet type: a different, quieter style — small text tabs, the selected one gets a soft fill */
  .market{height:36px}
  .market .fixed{padding:6px 4px 6px 8px;gap:6px}
  .market .fixed .vline{height:16px;background:var(--line)}
  .market .chips{padding:6px 8px 6px 0;gap:2px}
  .market .chip{height:24px;padding:0 8px;border-radius:6px;font:500 12px/14px Roboto;background:transparent;color:var(--muted);box-shadow:none}
  .market .chip[aria-pressed="true"]{background:var(--chip);color:var(--text);box-shadow:none}
  .chip.live{gap:5px}
  .chip.live svg{width:6px;height:6px;flex-basis:6px}
  .market .chip.live[aria-pressed="true"]{color:var(--live);background:rgba(23,207,47,.12);box-shadow:none}

  /* League header: lower, quieter column labels */
  .lh{height:28px;padding:2px 12px}
  .lh .name{font:600 13px/16px Roboto}
  .lh .labels{gap:2px;font:500 11px/14px Inter,sans-serif;color:var(--muted)}
  .lh .pin svg{width:20px;height:20px}

  /* 2. Tighter rows: 70 -> 56 */
  .row .content{min-height:56px}
  .tcol{padding-top:9px;gap:2px}
  .tcol .t{line-height:18px}
  .teams{padding:10px 0;gap:4px}
  .vdiv{display:none}

  /* Odds: separate rounded cells (Figma inspiration) */
  /* Odds: one segmented strip, as in Figma 174-248852 — 2px gaps, only the outer corners rounded (10),
     vertical gradient #3b3b44 -> #2e2e38 with a 1px #4b4b53 top highlight, Roboto Bold 14 */
  .odds{gap:2px;padding:8px 0}
  .odd{border-radius:0;background:linear-gradient(to top,#2e2e38,#3b3b44);box-shadow:inset 0 1px 0 #4b4b53;font:700 14px/16px Roboto;gap:0}
  .odd:first-child{border-radius:10px 0 0 10px}
  .odd:last-child{border-radius:0 10px 10px 0}
  .odd:only-child{border-radius:10px}
  .odd .arr{left:auto;right:4px;transform:none;width:8px;height:6px}
  .odd .arr.top{top:4px} .odd .arr.bottom{bottom:4px}
  .odd .prev{font-size:10px;line-height:12px}
  /* 4. Selection dialled down: brand outline + light tint instead of a solid block */
  .odd[aria-pressed="true"]{background:rgba(255,219,1,.12);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .odd[aria-pressed="true"] .v{color:var(--brand)}
  .odd[aria-pressed="true"] .prev{color:var(--muted)}

  .meta{padding:8px 0}
  .star{width:20px;height:20px}
  .pill{padding:2px 4px;font:500 11px/14px Inter,sans-serif;color:var(--muted);background:transparent}

  /* 3. More events: 40 -> 28, quieter */
  .more{height:28px;gap:2px;font:500 11px/14px Inter,sans-serif;color:var(--muted)}
  .more svg{width:14px;height:14px}
  .proto-note a{color:#9a9aa8}
</style>
</head>
<body>
<div class="device" id="device">
<div class="island"></div>
<div class="phone">
 <div class="scroller" id="scroller">
  <header class="appbar">
    <div class="status16"><span>9:41</span><span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.4c2.2 0 4.2.85 5.7 2.25l1.1-1.15A9.6 9.6 0 0 0 8 .8 9.6 9.6 0 0 0 1.2 3.5l1.1 1.15A8 8 0 0 1 8 2.4Zm0 3.2c1.35 0 2.6.5 3.55 1.35l1.1-1.15A6.5 6.5 0 0 0 8 4a6.5 6.5 0 0 0-4.65 1.8l1.1 1.15A5 5 0 0 1 8 5.6Zm0 3.2c.5 0 .97.18 1.35.48L8 10.7 6.65 9.28C7.03 8.98 7.5 8.8 8 8.8Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" opacity=".4"/></svg>
    </span></div>
    <div class="bar"><img src="assets/top-header.png" alt="Fortuna"></div>
  </header>
  <main id="main">
    <div class="h-scroll heroes">
      <img src="assets/hero-1.png" alt=""><img src="assets/hero-2.png" alt=""><img src="assets/hero-3.png" alt=""><img src="assets/hero-4.png" alt="">
    </div>
    <div class="h-scroll akos">
      <img class="tall" src="assets/ako-1.png" alt=""><img class="tall" src="assets/ako-2.png" alt=""><img class="short" src="assets/ako-3.png" alt=""><img class="short" src="assets/ako-4.png" alt=""><img class="short" src="assets/ako-5.png" alt="">
    </div>
    <div class="section-head">
      <h2>Upcoming Events</h2>
      <div class="toggle">Compact <button class="switch" id="compact" role="switch" aria-checked="true" aria-label="Compact view"><i></i></button></div>
    </div>
    <div class="chips sport-chips" id="sports"></div>
    <div id="list"></div>
  </main>
 </div>
  <nav class="nav" id="nav"><img id="navImg" src="assets/nav-home.png" alt=""><div class="hits" id="navHits"></div></nav>
  <div class="toast" id="toast" role="status"><span id="toastIcon"></span><span id="toastText"></span></div>
</div>
<div class="home-ind"></div>
</div>
<p class="proto-note">Compact v2 (review notes) · <a href="./">see v1</a> · scroll the list: the league name changes, 1 X 2 stays · tap odds, ☆, pins, chips, Compact</p>

<script>
// Icons exported from the Figma library (SVG)

const ODDS_W={3:132,2:104,1:96};

const st={sport:'football',market:'mw',liveOnly:false,compact:true,pinned:null,expanded:{},sel:new Set(),fav:new Set(),tab:'home'};
const $=s=>document.querySelector(s);
const fmt=v=>v.toFixed(2);
function oddsFor(m,market){
  if(market.id==='mw'||st.sport==='tennis') return m.o.slice(0,market.cols.length);
  const seed=(m.t1.length*7+m.t2.length*3)%10/20;
  if(market.id==='btts') return [1.55+seed,2.20-seed*0.8];
  return [1.65+seed];
}
function render(){
  const sp=SPORTS[st.sport];
  $('#sports').innerHTML=['football','hockey','tennis','basket','volley','handball','floorball','darts','esports','baseball'].map(k=>[k,SPORTS[k]]).map(([k,s])=>`<button class="chip" data-sport="${k}" aria-pressed="${k===st.sport}">${ICON[s.icon]}${s.label}</button>`).join('');
  const market=sp.markets.find(x=>x.id===st.market)||sp.markets[0]; st.market=market.id;
  const cols=market.cols; document.documentElement.style.setProperty('--odds-w',ODDS_W[cols.length]+'px');
  const marketRow=`<div class="market"><div class="fixed"><button class="chip live" data-live aria-pressed="${st.liveOnly}">${ICON.live}Live</button><span class="vline"></span></div><div class="chips">${sp.markets.map(x=>`<button class="chip" data-market="${x.id}" aria-pressed="${x.id===st.market}">${x.label}</button>`).join('')}</div></div>`;
  if(!st.compact){ $('#list').innerHTML=`<div class="cards"><img src="assets/card-view.png" alt="Card view"></div>`; return; }
  let leagues=sp.leagues.slice();
  if(st.pinned){ const i=leagues.findIndex(l=>l.id===st.pinned); if(i>0) leagues.unshift(leagues.splice(i,1)[0]); }
  leagues=leagues.map(l=>({...l,matches:l.matches.filter(m=>!st.liveOnly||m.live)})).filter(l=>l.matches.length);
  if(!leagues.length){ $('#list').innerHTML=`<div class="table">${marketRow}<div class="empty">No ${st.liveOnly?'live ':''}events for ${sp.label} right now.</div></div>`; return; }
  const pinBtn=l=>`<button class="pin" data-pin="${l.id}" aria-pressed="${st.pinned===l.id}" aria-label="Pin ${l.name}">${st.pinned===l.id?ICON.pinOn:ICON.pinOff}</button>`;
  const first=leagues[0];
  $('#list').innerHTML=`<div class="table">${marketRow}
    <div class="lh bar" id="bar"><span class="name">${first.name}</span><span class="labels">${cols.map(c=>`<span>${c}</span>`).join('')}</span>${pinBtn(first)}</div>`+leagues.map((l,li)=>{
    const open=!!st.expanded[l.id]; const show=open?l.matches:l.matches.slice(0,2);
    return `<section class="league" data-league="${l.id}">
      ${li>0?`<div class="lh"><span class="name">${l.name}</span>${pinBtn(l)}</div>`:''}
      ${show.map(m=>rowHTML(l,m,market,cols)).join('')}
      ${l.matches.length>2?`<button class="more" data-more="${l.id}" aria-expanded="${open}">${open?'Show less':`More events (${l.total})`}${ICON.chev}</button>`:`<div style="height:8px"></div>`}
    </section>`;}).join('')+`</div>`;
}
function oddBtn(l,m,i,v){
  if(m.locked) return `<span class="odd locked">${ICON.lock}</span>`;
  const key=`${st.sport}|${st.market}|${l.id}|${m.t1}|${i}`;
  const chg=(st.market==='mw'&&m.chg&&m.chg[i])||0; const prev=st.market==='mw'&&m.prev&&m.prev[i];
  const top=chg==='up'?ICON.up:chg==='split-up'?ICON.splitUp:''; const bot=chg==='down'?ICON.down:chg==='split-down'?ICON.splitDown:'';
  return `<button class="odd ${chg||''}" data-odd="${key}" aria-pressed="${st.sel.has(key)}">${top}${chg==='split-down'&&prev?`<span class="prev">${fmt(prev)}</span>`:''}<span class="v">${fmt(v)}</span>${chg==='split-up'&&prev?`<span class="prev">${fmt(prev)}</span>`:''}${bot}</button>`;
}
function rowHTML(l,m,market,cols){
  const o=oddsFor(m,market); const fk=`${st.sport}|${m.t1}|${m.t2}`;
  const score=i=>m.sets?`<span class="s sets">${m.sets[i]}</span>`:(m.live&&m.s?`<span class="s">${m.s[i]}</span>`:'');
  return `<div class="row"><div class="content">
    <div class="ev"><div class="tcol">${ICON.stream}<span class="t ${m.live?'live':''}">${m.time}</span></div>
      <div class="teams"><div class="team"><span class="n">${m.t1}</span>${m.serve===0?'<span class="serve"></span>':''}${score(0)}</div>
        <div class="team"><span class="n">${m.t2}</span>${m.serve===1?'<span class="serve"></span>':''}${score(1)}</div></div></div>
    <div class="vdiv"></div>
    <div class="odds">${cols.map((c,i)=>oddBtn(l,m,i,o[i]??0)).join('')}</div>
    <div class="meta"><button class="star" data-fav="${fk}" aria-pressed="${st.fav.has(fk)}" aria-label="Favourite">${st.fav.has(fk)?ICON.starOn:ICON.starOff}</button><span class="pill">+${m.more}</span></div>
  </div><div class="sep"></div></div>`;
}
function toast(msg,icon){ const t=$('#toast'); $('#toastText').textContent=msg; $('#toastIcon').innerHTML=icon||''; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function scroller(){ return matchMedia('(min-width:600px)').matches?$('#scroller'):document.scrollingElement; }
function scrollToList(){ const sc=scroller(); const base=sc===document.scrollingElement?0:sc.getBoundingClientRect().top; const top=$('#list').getBoundingClientRect().top-base+sc.scrollTop-160; sc.scrollTo({top:Math.max(0,top),behavior:'smooth'}); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.sport){ st.sport=b.dataset.sport; st.market='mw'; st.expanded={}; st.pinned=null; render(); return; }
  if(b.dataset.market){ st.market=b.dataset.market; render(); return; }
  if('live' in b.dataset){ st.liveOnly=!st.liveOnly; render(); return; }
  if(b.dataset.odd){ const k=b.dataset.odd; st.sel.has(k)?st.sel.delete(k):st.sel.add(k); b.setAttribute('aria-pressed',st.sel.has(k)); return; }
  if(b.dataset.fav){ const k=b.dataset.fav; const on=!st.fav.has(k); on?st.fav.add(k):st.fav.delete(k); b.setAttribute('aria-pressed',on); b.innerHTML=on?ICON.starOn:ICON.starOff; return; }
  if(b.dataset.pin){ const id=b.dataset.pin; const lg=SPORTS[st.sport].leagues.find(l=>l.id===id); const p=lg.name.split(' • '); const name=/^(ATP|WTA)$/.test(p[0])?p[0]+' '+p[1].split(',')[0]:p[p.length-1];
    if(st.pinned===id){ st.pinned=null; render(); toast(`${name} unpinned`,ICON.pinOff); } else { st.pinned=id; render(); toast(`${name} pinned to the top`,ICON.pinOn); scrollToList(); } return; }
  if(b.dataset.more){ const id=b.dataset.more; st.expanded[id]=!st.expanded[id]; render(); return; }
  if(b.id==='compact'){ st.compact=!st.compact; b.setAttribute('aria-checked',st.compact); render(); return; }
  if(b.dataset.tab){ const t=b.dataset.tab; if(t==='home'||t==='live'){ st.tab=t; st.liveOnly=(t==='live'); $('#navImg').src=`assets/nav-${t}.png`; render(); scroller().scrollTo({top:0}); } else { toast(`${b.getAttribute('aria-label')} isn't part of this prototype`); } return; }
});
// The design is 375 wide. Zoom it to the device width:
// phone = the real screen width; desktop = an iPhone 16 (393×852 pt), scaled down only on short windows.
function fitPhone(){
  const p=$('.phone'), d=$('#device'), desk=matchMedia('(min-width:600px)').matches;
  const k=(desk?393:window.innerWidth)/375;
  p.style.zoom=k; document.documentElement.style.setProperty('--k',k);
  d.style.zoom=desk?Math.min(1,(window.innerHeight-56)/852):'';
}
addEventListener('resize',fitPhone); fitPhone();

// Sticky header row: keep 1 X 2, swap the league name (and its pin) to the competition the user is in.
function updateBar(){
  const bar=$('#bar'); if(!bar) return;
  const barR=bar.getBoundingClientRect(); let cur=null;
  for(const s of document.querySelectorAll('#list .league')){ if(s.getBoundingClientRect().top <= barR.top + barR.height/2) cur=s; else break; }
  if(!cur) cur=document.querySelector('#list .league'); if(!cur) return;
  const id=cur.dataset.league; if(bar.dataset.cur===id) return; bar.dataset.cur=id;
  const lg=SPORTS[st.sport].leagues.find(l=>l.id===id);
  bar.querySelector('.name').textContent=lg.name;
  const p=bar.querySelector('.pin'); p.dataset.pin=id; p.setAttribute('aria-pressed',st.pinned===id); p.setAttribute('aria-label','Pin '+lg.name); p.innerHTML=st.pinned===id?ICON.pinOn:ICON.pinOff;
}
const _render=render; render=function(){ _render(); updateBar(); };
addEventListener('scroll',updateBar,{passive:true});
$('#scroller').addEventListener('scroll',updateBar,{passive:true});
$('#navHits').innerHTML=['Home','Live','Sport','Tickets','Casino','Menu'].map(l=>`<button data-tab="${l.toLowerCase()}" aria-label="${l}"></button>`).join('');
render();
</script>
